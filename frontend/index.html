<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR 粒子互动系统</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Three.js -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div class="text">系统初始化中...<br>请允许摄像头权限</div>
    </div>
    
    <div id="ui-layer">
        <div class="status">当前手势: <span id="gesture-name">等待识别...</span></div>
        <div class="instruction">
            <span class="badge">🖐 张手: 球体</span>
            <span class="badge">✌ 剪刀手: Dyf</span>
            <span class="badge">✊ 握拳: 圆环</span>
            <span class="badge">☝ 食指: 星星</span>
            <span class="badge">👍 拇指: 爱心</span>
        </div>
        <div class="fps-counter">FPS: <span id="fps">0</span></div>
    </div>

    <!-- Video element for MediaPipe (hidden or small preview) -->
    <video class="input_video" playsinline style="display: none;"></video>
    
    <script src="shape-generator.js"></script>
    <script src="ui-components.js"></script>
    <script src="particle-system.js"></script>
    <script src="hand-tracker.js"></script>
    <script src="main.js"></script>
</body>
</html>
